version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: finstream-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - finstream-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 admin password; do
        echo 'MinIO waiting...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse;
      echo 'created bucket.';
      exit 0;
      "
    networks:
      - finstream-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: finstream-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - finstream-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finstream-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - finstream-net

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: finstream-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_SECRET=undefined
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./src:/opt/spark/src
    networks:
      - finstream-net

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: finstream-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
      - SPARK_RPC_AUTHENTICATION_SECRET=undefined
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./src:/opt/spark/src
    networks:
      - finstream-net

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: finstream-jupyter
    user: root
    ports:
      - "8888:8888"
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_TOKEN=admin
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
    networks:
      - finstream-net

  trino:
    image: trinodb/trino:436
    container_name: finstream-trino
    ports:
      - "8081:8080"
    volumes:
      - ./conf/trino/delta.properties:/etc/trino/catalog/delta.properties
    networks:
      - finstream-net

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: finstream-dbt
    volumes:
      - ./dbt_project:/usr/app
      - ./dbt_project/profiles.yml:/root/.dbt/profiles.yml
    networks:
      - finstream-net



  airflow-postgres:
    image: postgres:13
    container_name: finstream-airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - finstream-net

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - airflow-postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    command: version
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Bugra --lastname Toklu --role Admin --email admin@example.com
      "
    networks:
      - finstream-net

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: finstream-airflow-webserver
    depends_on:
      - airflow-postgres
      - airflow-init
    ports:
      - "8082:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=bu_cok_gizli_bir_sifredir_finstream_123
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
    command: webserver
    networks:
      - finstream-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: finstream-airflow-scheduler
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=bu_cok_gizli_bir_sifredir_finstream_123
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
    command: scheduler
    networks:
      - finstream-net

  metabase:
    image: metabase/metabase:latest
    container_name: finstream-metabase
    ports:
      - "3000:3000"
    networks:
      - finstream-net
    depends_on:
      - trino

networks:
  finstream-net:
    driver: bridge